packages:
  - packages/*
  - examples/*
  - docs
  - benchmarks

linkWorkspacePackages: true
preferWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild

catalog:
  typescript: ^6.0.0
  vitest: 5.0.5
  '@vitest/coverage-v8': 5.0.5
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  astro>vite: npm:vite@^6.4.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
