packages:
  - packages/*
  - examples/*
  - docs
  - benchmarks

linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@swc/core': false
  lmdb: false
  msgpackr-extract: false
  sharp: false

catalog:
  typescript: ^6.0.0
  vitest: 5.0.5
  '@vitest/coverage-v8': 5.0.5
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  astro>vite: npm:vite@^6.4.1
  # @var-ui/* hard-depend on a registry typestyles; keep exactly one runtime (the workspace copy).
  '@var-ui/core>typestyles': 'workspace:*'
  '@var-ui/astro>typestyles': 'workspace:*'
  '@var-ui/icons>typestyles': 'workspace:*'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@var-ui/core@0.14.0'
  - '@var-ui/astro@0.14.0'
  - '@var-ui/docs@0.14.0'
  - '@var-ui/icons@0.14.0'
