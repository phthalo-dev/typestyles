name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm turbo run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      # `turbo run test` builds packages that have tests. Publish needs every
      # package's dist, including ones outside that graph (for example
      # @typestyles/open-props). Build only the gaps, then hand dist to the
      # release jobs so they do not compile again.
      - name: Build packages the test graph skipped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              pnpm --filter "./$dir" run build
            fi
          done
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              echo "Missing dist for $dir"
              exit 1
            fi
          done

      - name: Pack package dist artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf package-dist.tar.gz packages/*/dist

      - name: Upload package dist artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: package-dist.tar.gz
          retention-days: 1
          if-no-files-found: error

  benchmark:
    name: Benchmark
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build typestyles
        run: pnpm --filter typestyles build

      - name: Run benchmarks
        run: pnpm --filter @typestyles/benchmarks bench:ci

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test]
    concurrency:
      # Separate from unstable publishes. A normal push used to leave this job
      # queued behind `pnpm -r publish`, and a version-package merge should
      # publish without waiting on (or running) that job.
      group: typestyles-changesets-release
      cancel-in-progress: false
      # Keep pending publishes instead of replacing them (default queue: single).
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Do not set registry-url on setup-node: it writes a placeholder _authToken
      # line that blocks npm Trusted Publishing (OIDC). Registry is in .npmrc.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1. Do not use npm@latest: npm 12 rejects
      # --git-checks, which pnpm forwards when changeset publish runs pnpm publish.
      - name: Use npm compatible with pnpm publish
        run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download package dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-dist

      - name: Restore package dist artifacts
        run: |
          tar -xzf package-dist.tar.gz
          rm package-dist.tar.gz
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              echo "Missing restored dist for $dir"
              exit 1
            fi
          done

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm release` is `turbo build && changeset publish`. dist is already
          # restored from the test job.
          publish: pnpm exec changeset publish
          version: pnpm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-unstable:
    name: Release unstable packages
    # Squash merges are "chore: version packages (#123)", not the exact title.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'chore: version packages')
    needs: [lint, typecheck, test]
    concurrency:
      group: typestyles-npm-unstable
      cancel-in-progress: false
      # Keep pending publishes instead of replacing them (default queue: single).
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Do not set registry-url on setup-node: it writes a placeholder _authToken
      # line that blocks npm Trusted Publishing (OIDC). Registry is in .npmrc.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1. Do not use npm@latest: npm 12 rejects
      # --git-checks forwarded by pnpm publish --no-git-checks.
      - name: Use npm compatible with pnpm publish
        run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download package dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-dist

      - name: Restore package dist artifacts
        run: |
          tar -xzf package-dist.tar.gz
          rm package-dist.tar.gz
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              echo "Missing restored dist for $dir"
              exit 1
            fi
          done

      - name: Set unstable commit versions
        run: node scripts/set-unstable-versions.js
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Publish all workspace packages with unstable tag
        run: pnpm -r --filter "./packages/*" publish --tag unstable --access public --no-git-checks
