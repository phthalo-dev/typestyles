name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      unstable:
        description: Publish every package to npm with the `unstable` tag, versioned from this commit
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only supersede PR runs. A newer push to main must never cancel a run that is
  # about to release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      benchmark: ${{ steps.filter.outputs.benchmark }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            benchmark:
              - 'packages/typestyles/**'
              - 'benchmarks/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'netlify.toml'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      # Builds every package (publishing needs every dist), then check, then tests.
      - run: vp run ci

      - name: Pack package dist artifacts
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.unstable)
        run: |
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              echo "Missing dist for $dir"
              exit 1
            fi
          done
          tar -czf package-dist.tar.gz packages/*/dist

      - name: Upload package dist artifacts
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.unstable)
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: package-dist.tar.gz
          retention-days: 1
          if-no-files-found: error

  benchmark:
    name: Benchmark
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      - run: vp run -F typestyles build

      - run: vp run -F @typestyles/benchmarks bench:ci

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: typestyles-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so the version PR and the tags the
      # release pushes trigger workflows.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Do not set registry-url on setup-vp: it writes a placeholder _authToken
      # line that blocks npm Trusted Publishing (OIDC). Registry is in .npmrc.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      # Trusted Publishing needs npm >= 11.5.1. Do not use npm@latest: npm 12 rejects
      # --git-checks, which pnpm forwards when changeset publish runs pnpm publish.
      - name: Use npm compatible with pnpm publish
        run: npm install -g 'npm@^11.5.1'

      - uses: actions/download-artifact@v8
        with:
          name: package-dist

      - name: Restore package dist artifacts
        run: |
          tar -xzf package-dist.tar.gz
          rm package-dist.tar.gz
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              echo "Missing restored dist for $dir"
              exit 1
            fi
          done

      - uses: changesets/action@v1
        with:
          # dist is already restored from verify, so skip `pnpm release` (which builds).
          publish: vp exec changeset publish
          version: vp exec changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-unstable:
    name: Publish unstable packages
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.unstable
    concurrency:
      group: typestyles-npm-unstable
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Do not set registry-url on setup-vp: it writes a placeholder _authToken
      # line that blocks npm Trusted Publishing (OIDC). Registry is in .npmrc.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      # Trusted Publishing needs npm >= 11.5.1. Do not use npm@latest: npm 12 rejects
      # --git-checks forwarded by pnpm publish --no-git-checks.
      - name: Use npm compatible with pnpm publish
        run: npm install -g 'npm@^11.5.1'

      - uses: actions/download-artifact@v8
        with:
          name: package-dist

      - name: Restore package dist artifacts
        run: |
          tar -xzf package-dist.tar.gz
          rm package-dist.tar.gz
          for dir in packages/*; do
            if [ ! -d "$dir/dist" ]; then
              echo "Missing restored dist for $dir"
              exit 1
            fi
          done

      - name: Set unstable commit versions
        run: node scripts/set-unstable-versions.js
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Publish all workspace packages with unstable tag
        run: pnpm -r --filter "./packages/*" publish --tag unstable --access public --no-git-checks

  deploy-docs:
    name: Deploy docs
    needs: [changes, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      # --build runs the build command and function packaging from netlify.toml,
      # the same path Netlify's own builds take (the MCP function needs it).
      - name: Build and deploy to Netlify
        run: npx netlify-cli@24 deploy --build --prod --filter docs --message "Deploy from ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  preview-docs:
    name: Preview docs
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Build and deploy preview to Netlify
        id: deploy
        run: |
          npx netlify-cli@24 deploy \
            --build \
            --filter docs \
            --alias=deploy-preview-${{ github.event.pull_request.number }} \
            --message "PR #${{ github.event.pull_request.number }}: ${{ github.sha }}" \
            --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- docs-preview-comment -->';
            const body = [
              marker,
              '### Docs preview',
              '',
              `🚀 [Open preview](${process.env.PREVIEW_URL})`,
              '',
              `Commit: \`${context.sha.slice(0, 7)}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
